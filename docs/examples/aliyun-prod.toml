# 数据源定义：/etc/wist-harvest/sources.d/<source_code>.toml
#
# 这是一个 **阿里云** 账号的样例。与腾讯云的差别：
#   - `vendor = "ALIYUN"`（选择适配器）
#   - `[credential]` 用 AccessKey：`access_key_id` / `access_key_secret`
#   - EIP 只有一路（阿里云接口直接返回全部 EIP，没有 WanIP/EIP 两道过滤）
#   - 没有项目（Project）维度：实例的 `ResourceGroupId` 落到 `project_id`

source_code = "aliyun-prod"
vendor = "ALIYUN"
group = "inventory"
env_ref = "prod"

# 地域范围：
#   "auto"  → 运行时用 ecs:DescribeRegions 解析
#   列 表   → 固定范围，可用 region_names 补充显示名
regions = "auto"
# regions = ["cn-hangzhou", "cn-beijing"]
# [region_names]
# cn-hangzhou = "华东1（杭州）"
# cn-beijing  = "华北2（北京）"

# 账单账号 ID（阿里云是账号 ID，不是 AccessKeyId）。
# 账单接口按它记账，跟凭据没有推导关系，所以必须显式写；只有跑 `cost` 子命令时才必需。
billing_account = "1234567890"

# 成本链路（契约 harvest-cost-v1）。不走数据平面，只写分片 + manifest。
[cost]
currency = "CNY"
# output_dir 不写就落到 <state_dir>/cost
rows_per_shard = 20000

[assets]
cloud_host = true
eip = true
vpc = true
subnet = true

# 凭据：只写"从哪读"，永远不写值。
# 二选一，且只能写一个。file 必须是 0600。
[credential]
access_key_id = { env = "SEC_ALIYUN_ACCESS_KEY_ID" }
access_key_secret = { env = "SEC_ALIYUN_ACCESS_KEY_SECRET" }
# access_key_id     = { file = "/etc/wist-harvest/secrets/aliyun.json", field = "access_key_id" }
# access_key_secret = { file = "/etc/wist-harvest/secrets/aliyun.json", field = "access_key_secret" }

# 仅测试/联调用：把所有阿里云 API 的 host 指向同一个 base URL。
# endpoint_override = "http://127.0.0.1:18080"
