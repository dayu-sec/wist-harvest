version: 2

# 与 `wist-gateway` 的 `dependabot.yml` 同一套（cargo + github-actions）。
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    labels:
      - "📦 dependencies"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - "📦 dependencies"
      - "ci"
