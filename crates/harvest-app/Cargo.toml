[package]
name = "harvest-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "harvest_app"
path = "src/lib.rs"

[[bin]]
name = "wist-harvest"
path = "src/main.rs"

[dependencies]
harvest-core.workspace = true
harvest-tencent.workspace = true
harvest-aws.workspace = true
harvest-warp.workspace = true
chrono.workspace = true
clap.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }

[dev-dependencies]
tempfile.workspace = true
